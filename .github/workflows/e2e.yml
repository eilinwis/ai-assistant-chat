name: e2e

# Comment on a PR: "e2e <path/to/spec.ts>" runs only that spec file, and
# reports back as a check on the PR's head commit.
# A bare "e2e", or anything not matching that exact shape, runs nothing.

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: read
  statuses: write

jobs:
  run-spec:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Parse comment for "e2e <spec path>"
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          TRIMMED="$(printf '%s' "$COMMENT_BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ "$TRIMMED" =~ ^e2e[[:space:]]+([^[:space:]]+)$ ]]; then
            echo "spec=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR head commit
        if: steps.parse.outputs.spec != ''
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .head.sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # This is what makes the run show up under the PR's "Checks" — a
      # commit status posted against the PR's own head SHA. issue_comment
      # runs aren't tied to a commit on their own, so without this the run
      # only shows in the repo's Actions tab, never on the PR itself.
      - name: Mark check as pending
        if: steps.parse.outputs.spec != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=pending \
            -f context="e2e" \
            -f description="Running ${{ steps.parse.outputs.spec }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout PR head
        if: steps.parse.outputs.spec != ''
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Set up Node.js
        if: steps.parse.outputs.spec != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.parse.outputs.spec != ''
        run: npm ci

      - name: Install Playwright browsers
        if: steps.parse.outputs.spec != ''
        run: npx playwright install --with-deps chromium

      - name: Run the requested spec file
        if: steps.parse.outputs.spec != ''
        id: run
        env:
          SPEC: ${{ steps.parse.outputs.spec }}
        run: |
          if [[ "$SPEC" == lessons/* ]]; then
            npx playwright test --config=lessons/playwright.config.ts "$SPEC"
          else
            npx playwright test "$SPEC"
          fi

      - name: Mark check with the result
        if: ${{ always() && steps.parse.outputs.spec != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.run.outcome }}" = "success" ]; then
            STATE=success
          else
            STATE=failure
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state="$STATE" \
            -f context="e2e" \
            -f description="${{ steps.parse.outputs.spec }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
