name: E2E on Comment

# Triggered by a comment on a pull request of the form:
#   e2e <path/to/spec.ts>
# Runs *only* that spec file. A bare "e2e" (no path), or a comment that
# doesn't match this exact shape, runs nothing.

on:
  issue_comment:
    types: [created]

jobs:
  parse:
    # issue_comment fires for both issues and PRs — .issue.pull_request only
    # exists on the PR case. Restrict who can trigger a CI run this way to
    # people already trusted with write access to the repo.
    if: >-
      ${{ github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    runs-on: ubuntu-latest
    outputs:
      spec: ${{ steps.parse.outputs.spec }}
    steps:
      - name: Parse comment for "e2e <spec path>"
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          TRIMMED="$(printf '%s' "$COMMENT_BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ "$TRIMMED" =~ ^e2e[[:space:]]+([^[:space:]]+)$ ]]; then
            echo "Matched command, spec: ${BASH_REMATCH[1]}"
            echo "spec=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "No 'e2e <path>' command found — nothing to run."
            echo "spec=" >> "$GITHUB_OUTPUT"
          fi

  run-spec:
    needs: parse
    if: needs.parse.outputs.spec != ''
    runs-on: ubuntu-latest
    steps:
      - name: React 👀 to the triggering comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content='eyes' --silent

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout the PR's head commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ github.event.issue.number }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the requested spec file
        id: run
        env:
          SPEC: ${{ needs.parse.outputs.spec }}
        run: |
          echo "Running: $SPEC"
          if [[ "$SPEC" == lessons/* ]]; then
            npx playwright test --config=lessons/playwright.config.ts "$SPEC"
          else
            npx playwright test "$SPEC"
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-comment-report-${{ github.event.comment.id }}
          path: playwright-report/
          retention-days: 7

      - name: React with the result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.run.outcome }}
        run: |
          if [ "$RESULT" = "success" ]; then
            CONTENT='+1'
          else
            CONTENT='-1'
          fi
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content="$CONTENT" --silent
